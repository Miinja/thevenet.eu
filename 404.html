<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>404 - Page introuvable / Page not found | Lucas Thevenet</title>
<style>
:root{--bg:#f1f1f1;--fg:#151617;--muted:#797d83}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f2f5fc;--muted:#8c8f96}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:2rem}
main{max-width:34rem}
.code{font-size:clamp(5rem,22vw,9rem);font-weight:300;line-height:1;margin:0;letter-spacing:-.03em}
h1,.h1{font-size:1.6rem;font-weight:500;margin:1rem 0 .5rem}
p{color:var(--muted);line-height:1.6;margin:0 0 2rem}
a{color:var(--fg);text-underline-offset:.25rem}
a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
section+section{margin-top:2.5rem;padding-top:2rem;border-top:1px solid var(--muted)}
section p{margin-bottom:1.25rem}
</style>
</head>
<body>
<main>
<p class="code" aria-hidden="true">404</p>
<section lang="fr">
<h1>Page introuvable</h1>
<p>La page que vous cherchez n'existe pas ou a été déplacée.</p>
<a href="/" hreflang="fr">&larr; Retour au portfolio</a>
</section>
<section lang="en">
<h2 class="h1">Page not found</h2>
<p>The page you are looking for doesn't exist or has been moved.</p>
<a href="/en.html" hreflang="en">&larr; Back to the portfolio</a>
</section>
</main>
</body>
</html>
